#!/bin/sh
# Pins for shuttle's self-provisioned floor tools (issue #101, disposition (c)).
#
# Single source of truth shared by build-tool.sh (download + build),
# gen-manifest.sh (sha256 + metadata) and .github/workflows/tools-artifacts.yml
# (tools_version). SOURCE_URL/SHA256 point at upstream-ATTACHED release
# tarballs — stable bytes, not GitHub auto-generated source snapshots.
#
# tools_version is monotonic per #101 (doctor's stale detection is a compare
# against it): bump by hand together with any tool pin below. Tools ship as
# one atomic provision set, so one version covers all five binaries.
# Every var below is consumed by the scripts that source this file, not by
# this file — that is the point of a pins file.
# shellcheck disable=SC2034
TOOLS_VERSION=1

# Builder image: Alpine 3.20 pinned by digest. The digest pins the toolchain
# bytes; musl is the static-linking libc of record for this floor set.
ALPINE_IMAGE='alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'

# squashfs-tools: one source tree builds both mksquashfs + unsquashfs.
# 4.7.5 = current 4.7.x stable (2026-03).
SQUASHFS_TOOLS_VERSION='4.7.5'
SQUASHFS_TOOLS_SOURCE_URL='https://github.com/plougher/squashfs-tools/releases/download/4.7.5/squashfs-tools-4.7.5.tar.gz'
SQUASHFS_TOOLS_SHA256='547b7b7f4d2e44bf91b6fc554664850c69563701deab9fd9cd7e21f694c88ea6'

# bubblewrap: upstream ships no static artifacts (community musl builds are
# the only precedent). 0.11.2 is the most-soaked 2026 release and carries an
# upstream .sha256sum to pin against; 0.13.0 (2026-09-22) is days old — too
# green for a provisioned floor. NOTE: a CI-built bwrap only ships if the
# functional sandbox probe passes — that probe belongs to the doctor lane
# (#101 AC-2) and gates the release, not this recipe.
BUBBLEWRAP_VERSION='0.11.2'
BUBBLEWRAP_SOURCE_URL='https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz'
BUBBLEWRAP_SHA256='69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6'

# GNU tar: 1.35 = current stable on ftp.gnu.org.
TAR_VERSION='1.35'
TAR_SOURCE_URL='https://ftp.gnu.org/gnu/tar/tar-1.35.tar.xz'
TAR_SHA256='4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16'

# curl: 8.20.0 matches the version the pod pool already carries
# (pkgs/curl_8.20.0). Provisioned curl is PATH-FALLBACK ONLY (manifest
# precedence "path_first"): host curl wins because it lives behind corporate
# NSS/LDAP directories and custom CA bundles that a musl-static build cannot
# honor (musl ignores nsswitch.conf). Corporate CA note: this build bakes the
# standard ca-certificates bundle path plus --with-ca-fallback; it will NOT
# read host NSS stores.
CURL_VERSION='8.20.0'
CURL_SOURCE_URL='https://curl.se/download/curl-8.20.0.tar.xz'
CURL_SHA256='63fe2dc148ba0ceae89922ef838f7e5c946272c2e78b7c59fab4b79d3ce2b896'

# Manifest constants (schema in gen-manifest.sh; #101 AC-10).
MANIFEST_TRIPLE='x86_64-unknown-linux-musl'
MANIFEST_MIN_KERNEL='3.2'
