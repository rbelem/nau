[package]
name = "nau"
version = "0.1.0"
edition = "2021"
description = "Build Snap packages from Lua declarations"
license = "GPL-3.0-only"

# The ADR-0051 workspace: the root package stays the only shipped binary;
# the lib's domain seams peel off into member crates one per PR. resolver
# "2" is implied by the root package's edition 2021, pinned here explicitly.
[workspace]
members = [
    "crates/nau-core",
    "crates/nau-infra",
    "crates/nau-chart",
    "crates/nau-build",
    "crates/nau-image",
    "crates/nau-ship",
    "crates/nau-peer",
    "crates/nau-pod",
]
resolver = "2"

[dependencies]
# The core crate (ADR-0051): the shared vocabulary — snap value types,
# manifest IR, plugin option values. Domains may depend on it; it never
# depends on a domain or on this root package.
nau-core = { path = "crates/nau-core" }
# The non-domain leaf (issue #326): terminal presentation and external
# tool provisioning. Same direction rule as nau-core.
nau-infra = { path = "crates/nau-infra" }
# The chart domain (issue #326): Lua DSL, eval, analysis,
# check/lint/audit/lock/index/deps. May depend on nau-core and nau-infra
# only — never sideways; the root composes every domain.
nau-chart = { path = "crates/nau-chart" }
# The build domain (issue #326 PR 2): the snap build machinery, the build
# cache, merged build prefixes, the leak scan, the source cache. May
# depend on nau-core and nau-infra only — never sideways; the root
# composes every domain.
nau-build = { path = "crates/nau-build" }
# The image domain (issue #326 PR 3): the UC image build/verify pipeline,
# the release media, the UC seed, the app-runtime unit emission.
nau-image = { path = "crates/nau-image" }
# The ship domain (issue #326 PR 4): the OCI registry client, the pull
# reference grammar, the peer/static pull transport lane.
nau-ship = { path = "crates/nau-ship" }
# The peer domain (issue #326 PR 5): mDNS discovery, the read-only
# serve surface, the static export lane.
nau-peer = { path = "crates/nau-peer" }
# The pod domain (issue #326 PR 6): the bin farm + launcher/font emit
# family, the `nau run` confinement backend, secret resolution, and the
# pod grammar's pure halves.
nau-pod = { path = "crates/nau-pod" }
clap = { version = "4", features = ["derive"] }
mlua = { version = "0.12", features = ["luau"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
# Snap Store assertion verification (ADR-0011 step b): OpenPGP v4
# RSA-SHA512 over assertion wire bytes (see src/assert.rs).
pgp = "0.20"
# snapd assertion SIGNING (#28/#32): snapd's assertion crypto implements
# ONLY OpenPGP v4 RSA-SHA512 (asserts/crypto.go — no ed25519 anywhere), so
# the UC seed's model/account/account-key assertions are signed with an
# RSA-4096 key through the same pgp crate; rsa is the direct handle for
# keygen + PKCS#8 persistence. Both were already vendored (via pgp) — no
# new vendored code.
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
# Self-managed update-manifest signing (ADR-0011 step d, see src/sign.rs):
# Ed25519 over canonical manifest bytes. Already locked transitively (via
# pgp) at 2.2 — no new vendored code; keygen reads /dev/urandom directly.
ed25519-dalek = "2"
sha2 = "0.10"
sha3 = "0.10"
tempfile = "3"
# Dependency-closure fetch (ADR-0017, issue #13): npm registry tarballs are
# gzip tarballs — decode + extract with the same crates build.rs already
# vendors (kept at identical versions; no new vendored code).
flate2 = "1"
tar = "0.4"
# Source tarball extraction (issue #170): .tar.xz sources decode in-process
# with the same xz2 0.1.7 already in the lock (zip's dependency — the crate
# set does not change). Extracting must not depend on whatever `tar` binary
# the caller's PATH happens to carry: busybox tar rejects the high-dictionary
# xz streams toolchain tarballs ship (rust dist = 128 MiB dict).
xz2 = "0.1"
libc = "0.2"
clap_complete = "4"

[profile.release]
# The image build embeds this binary into every image it builds at
# /usr/bin/nau (issue #81): strip the symbol table so the shipped
# artifact — and every A/B slot and update payload carrying it — stays
# small. The guest never needs symbols: the boot units exec it headlessly.
strip = true

[dev-dependencies]
# The live-D-Bus gated secrets test (NAU_SECRETS_LIVE_DBUS=1) drives the
# real Secret Service client; the provider itself lives in nau-pod.
dbus-secret-service = { version = "4", features = ["crypto-rust", "vendored"] }
# Dependency-fetch integration tests (issue #13): compute npm SRI
# integrity and wheel hashes for the loopback registry fixtures.
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
# Pod lockfile assertions in the recipe-drift tests (issue #142).
serde_json = "1"
# Go module zip construction for the go resolver fixtures (issue #40):
# the loopback proxy serves a real module zip in the proxy archive shape.
zip = "2"
# Worker stderr-forwarding tests (issue #76): dup2 the test process's
# stderr onto a never-read pipe to prove a wedged sink cannot outlive the
# containment deadline.
libc = "0.2"
