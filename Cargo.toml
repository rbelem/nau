[package]
name = "shuttle"
version = "0.1.0"
edition = "2021"
description = "Build Snap packages from Lua declarations"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
mlua = { version = "0.10", features = ["luau"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# uv.lock parsing for the pip resolver (ADR-0017): uv's cross-platform
# Python lockfile is TOML.
toml = "0.8"
base64 = "0.22"
# Snap Store assertion verification (ADR-0011 step b): OpenPGP v4
# RSA-SHA512 over assertion wire bytes (see src/assert.rs).
pgp = "0.20"
# snapd assertion SIGNING (#28/#32): snapd's assertion crypto implements
# ONLY OpenPGP v4 RSA-SHA512 (asserts/crypto.go — no ed25519 anywhere), so
# the UC seed's model/account/account-key assertions are signed with an
# RSA-4096 key through the same pgp crate; rsa is the direct handle for
# keygen + PKCS#8 persistence. Both were already vendored (via pgp) — no
# new vendored code.
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
# Self-managed update-manifest signing (ADR-0011 step d, see src/sign.rs):
# Ed25519 over canonical manifest bytes. Already locked transitively (via
# pgp) at 2.2 — no new vendored code; keygen reads /dev/urandom directly.
ed25519-dalek = "2"
sha2 = "0.10"
sha3 = "0.10"
tempfile = "3"
indicatif = "0.18"
# Dependency-closure fetch (ADR-0017, issue #13): npm registry tarballs are
# gzip tarballs — decode + extract with the same crates build.rs already
# vendors (kept at identical versions; no new vendored code).
flate2 = "1"
tar = "0.4"
# Go module zips (ADR-0017 extension, issue #40): the module proxy serves
# each module as a ZIP archive (not a tar), read in-process at fetch time
# with the standard library's DEFLATE stack — data-only, nothing executes.
zip = "2"
owo-colors = "4"
libc = "0.2"
clap_complete = "4"
# The Rust-side definition parser (single parser for require seeding,
# literal-require enforcement, and schema-diagnostic spans). The `luau`
# feature is load-bearing: definitions are Luau, incl. type annotations.
full_moon = { version = "2", features = ["luau"] }
# LAN peer discovery (ADR-0033 Decisions 3+4, src/discovery.rs): the ONE
# new runtime crate of the peer-sharing feature. mdns-sd is synchronous
# pure Rust with no async-runtime dependency. Its transitive tree (from
# `cargo tree -e normal -p mdns-sd` at 0.21.3): fastrand, flume
# (+ futures-core, futures-sink, spin → lock_api → scopeguard), if-addrs,
# log, mio, socket-pktinfo, socket2. Genuinely NEW units in the lock
# (git diff Cargo.lock, `+name` lines): mdns-sd, flume, futures-sink,
# if-addrs, mio, socket-pktinfo, socket2 — fastrand/futures-core/spin/
# lock_api/scopeguard/log were already vendored via pgp/tempfile, and
# libc only bumps. No tokio, no hyper.
mdns-sd = "0.21"

[build-dependencies]
# Luau analyzer build (see build.rs + shim/): upstream C++ compiled with cc.
cc = { version = "1.2", features = ["parallel"] }
# build.rs unpacks the vendored Luau analyzer tarball.
flate2 = "1"
tar = "0.4"

[profile.release]
# The image build embeds this binary into every image it builds at
# /usr/bin/shuttle (issue #81): strip the symbol table so the shipped
# artifact — and every A/B slot and update payload carrying it — stays
# small. The guest never needs symbols: the boot units exec it headlessly.
strip = true

[dev-dependencies]
# Dependency-fetch integration tests (issue #13): compute npm SRI
# integrity and wheel hashes for the loopback registry fixtures.
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
# Pod lockfile assertions in the recipe-drift tests (issue #142).
serde_json = "1"
# Go module zip construction for the go resolver fixtures (issue #40):
# the loopback proxy serves a real module zip in the proxy archive shape.
zip = "2"
# Worker stderr-forwarding tests (issue #76): dup2 the test process's
# stderr onto a never-read pipe to prove a wedged sink cannot outlive the
# containment deadline.
libc = "0.2"
