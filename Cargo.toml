[package]
name = "shuttle"
version = "0.1.0"
edition = "2021"
description = "Build Snap packages from Lua declarations"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sha3 = "0.10"
tempfile = "3"
indicatif = "0.18"
owo-colors = "4"
clap_complete = "4"
