[package]
name = "shoot-nickel-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "ADR-0009 spike: Nickel embed feasibility for shoot package definitions"

[dependencies]
# Bake-off candidates — both present; the spike picks one.
nickel-lang-core = "=0.18.0"
nickel-lang = "=2.2.0"
# Golden-parity Lua path (incumbent stack, mirrors root Cargo.toml)
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
regex = "1"
codespan = "0.13"
codespan-reporting = "0.13"

[profile.dev]
debug = 0
