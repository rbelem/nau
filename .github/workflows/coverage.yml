# Nightly coverage measurement for shuttle.
#
# Instrumented build roughly doubles the gate's cost, so this runs on a
# schedule instead of every PR. The floor ratchets as tails get covered —
# see docs/agents/coverage.md for the baseline, the per-file table, and
# the structurally-unreachable ceilings.

name: coverage

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Allow unprivileged userns (bubblewrap sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install golang (go-deps tests build inside the sandbox)
        run: sudo apt-get install -y --no-install-recommends golang-go

      # Same hand-rolled closure cache as CI's check job — see the
      # rationale there (devbox-install-action#28 key drift, #79 inner
      # v16 cache). The nightly save runs at job end, so the llvm
      # tools that `nix build` adds to /nix/store are captured too and
      # subsequent nights skip that fetch entirely.
      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: experimental-features = ca-derivations fetch-closure

      - name: Tar shim for /nix store restore
        run: |
          mkdir -p ~/.local/bin
          printf '#!/bin/sh\nexec sudo /usr/bin/tar "$@"\n' > ~/.local/bin/tar
          chmod +x ~/.local/bin/tar

      - name: Restore nix store closure
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/devbox
            ~/.cache/nix
            ~/.local/state/nix
            ~/.nix-defexpr
            ~/.nix-profile
            /nix/store
            /nix/var/nix
          key: devbox-nix-store-v1-${{ runner.os }}-${{ hashFiles('devbox.json') }}
          restore-keys: |
            devbox-nix-store-v1-${{ runner.os }}-

      - name: Install devbox
        uses: jetify-com/devbox-install-action@734088efddca47cf44ff8a09289c6d0e51b73218 # v0.12.0
        with:
          project-path: .
          devbox-version: 0.18.3
          enable-cache: false
          skip-nix-installation: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: rust-1.97.1
          cache-on-failure: true
          workspaces: .

      # Same unprivileged-build sequence as CI's check job: build before
      # the instrumented test run.
      - name: Build
        run: devbox run -- build

      # The devbox rustc has no rustup llvm-tools; cargo-llvm-cov takes
      # the LLVM pair through env vars (its documented seam — see
      # docs/agents/coverage.md for why not --llvm-path).
      - name: LLVM tools for cargo-llvm-cov
        run: nix build github:NixOS/nixpkgs/nixos-26.05#llvm --out-link /tmp/llvm-link

      - name: Measure coverage (fail under 86% lines)
        run: |
          env -u LD_LIBRARY_PATH \
            LLVM_COV=/tmp/llvm-link/bin/llvm-cov \
            LLVM_PROFDATA=/tmp/llvm-link/bin/llvm-profdata \
            devbox run -- bash -c 'SHUTTLE_SYSTEMD=off cargo llvm-cov \
              --workspace --all-targets --locked \
              --fail-under-lines 86 \
              --lcov --output-path lcov.info \
              --summary'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

      # Same save discipline as CI's check job — main-only, always().
      # Runs after the coverage steps, so the llvm closure added by
      # `nix build` above is part of the saved snapshot.
      - name: Save nix store closure
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/devbox
            ~/.cache/nix
            ~/.local/state/nix
            ~/.nix-defexpr
            ~/.nix-profile
            /nix/store
            /nix/var/nix
          key: devbox-nix-store-v1-${{ runner.os }}-${{ hashFiles('devbox.json') }}
