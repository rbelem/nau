# CI for shuttle — Rust CLI tool that builds Snap packages from Lua declarations.
#
# Jobs, cheapest first:
#   lint-workflow — actionlint over this file; no toolchain, runs in seconds.
#   deps          — cargo-deny: license/advisory/source policy (deny.toml).
#   check         — the devbox gate: build, test, clippy -D warnings, fmt --check.
#
# The Rust linter (clippy) and style checker (rustfmt) are the Lint/Format
# steps of `check`; the pinned 1.97.1 toolchain is the contract (see
# docs/agents/build-and-test.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download actionlint
        run: |
          curl -fsSL --retry 3 --retry-all-errors --max-time 60 \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash |
          bash -s -- 1.7.7

      - name: Lint workflow
        run: ./actionlint -color

  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2
        with:
          tool: cargo-deny@0.19.6

      # The advisory DB re-clones from GitHub every run; cache it under a
      # week-bucketed key so it refreshes weekly, with restore-keys seeding
      # a new week from the previous one (only the delta gets fetched).
      - name: Week bucket for advisory DB cache
        run: echo "WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      - name: Cache RustSec advisory DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/advisory-dbs
          key: cargo-deny-advisory-db-${{ env.WEEK }}
          restore-keys: cargo-deny-advisory-db-

      - name: Check licenses, advisories, sources
        run: cargo deny check

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor
      # (kernel.apparmor_restrict_unprivileged_userns=1), which strips
      # bubblewrap's netns of CAP_NET_ADMIN — every sandboxed e2e test
      # dies with "bwrap: loopback: Failed RTM_NEWADDR: Operation not
      # permitted". Runners have passwordless sudo; lift the restriction
      # for the job.
      - name: Allow unprivileged userns (bubblewrap sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The go-deps tests (tests/pod_deps.rs) gate on host go being
      # sandbox-visible, but on GH runners go lives in /usr/local/go —
      # a SEPARATE mount that bwrap's /usr bind does not cross — so the
      # gate passes host-side while the sandbox itself reports
      # "go: not found". The distro go lands at /usr/bin/go, inside the
      # bound /usr, where the sandbox can actually use it.
      - name: Install golang (go-deps tests build inside the sandbox)
        run: sudo apt-get install -y --no-install-recommends golang-go

      # The nix-store closure (~1.5 GiB, qemu included) is cached by
      # hand instead of via devbox-install-action's enable-cache for
      # two upstream reasons: its cache key hashes devbox.lock, which
      # `devbox run` rewrites mid-job, so restore and save hash
      # differently and the cache can never hit
      # (jetify-com/devbox-install-action#28); and the action's inner
      # nix-installer v16 carries its own /nix/store cache against the
      # decommissioned GH cache service — 400s every run, no knob to
      # disable (jetify-com/devbox-install-action#79). Nix therefore
      # installs directly (v17+ dropped that inner cache), and the
      # closure restore/save below use a stable key keyed on
      # devbox.json with a prefix fallback: after a devbox.json bump
      # the exact key misses but restore-keys still seeds from the old
      # closure, and nix fills the delta from cache.nixos.org.
      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: experimental-features = ca-derivations fetch-closure

      # Restoring /nix/store as non-root needs this sudo tar shim
      # (actions/cache shells out to `tar`; copied from the devbox
      # action's own Linux workaround).
      - name: Tar shim for /nix store restore
        run: |
          mkdir -p ~/.local/bin
          printf '#!/bin/sh\nexec sudo /usr/bin/tar "$@"\n' > ~/.local/bin/tar
          chmod +x ~/.local/bin/tar

      - name: Restore nix store closure
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/devbox
            ~/.cache/nix
            ~/.local/state/nix
            ~/.nix-defexpr
            ~/.nix-profile
            /nix/store
            /nix/var/nix
          key: devbox-nix-store-v1-${{ runner.os }}-${{ hashFiles('devbox.json') }}
          restore-keys: |
            devbox-nix-store-v1-${{ runner.os }}-

      - name: Install devbox
        uses: jetify-com/devbox-install-action@734088efddca47cf44ff8a09289c6d0e51b73218 # v0.12.0
        with:
          project-path: .
          devbox-version: 0.18.3
          enable-cache: false
          skip-nix-installation: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: rust-1.97.1
          cache-on-failure: true
          workspaces: .

      # Cheap format gate before the expensive build: a whitespace-only
      # PR learns about it in seconds, not after build+test+clippy.
      - name: Format check
        run: devbox run -- fmt-check

      - name: Build
        run: devbox run -- build

      # The devbox scripts are the gate (docs/agents/build-and-test.md)
      # and intentionally spell no --locked: instead of policing the
      # command form, fail closed when a dependency bump landed without
      # its Cargo.lock commit — cargo would otherwise resolve fresh in
      # CI and test something no fresh clone or release can reproduce.
      - name: Lockfile must be committed
        run: git diff --exit-code Cargo.lock

      - name: Test
        run: devbox run -- test

      - name: Lint (clippy)
        run: devbox run -- clippy

      - name: Lua lint (luacheck)
        run: devbox run -- luacheck pkgs/

      - name: Lua style (stylua)
        run: devbox run -- stylua --check pkgs/

      # Seeds the closure for the next run. Main-only: PR runs restore
      # from main's cache but never race it — concurrent reserves of the
      # same key were the "another job may be creating this cache"
      # failure on every overlapping run. always() so a red gate still
      # warms the cache; the closure is complete right after the devbox
      # install either way.
      - name: Save nix store closure
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/devbox
            ~/.cache/nix
            ~/.local/state/nix
            ~/.nix-defexpr
            ~/.nix-profile
            /nix/store
            /nix/var/nix
          key: devbox-nix-store-v1-${{ runner.os }}-${{ hashFiles('devbox.json') }}
