# CI for shuttle — Rust CLI tool that builds Snap packages from Lua declarations.
#
# Jobs, cheapest first:
#   lint-workflow — actionlint over this file; no toolchain, runs in seconds.
#   deps          — cargo-deny: license/advisory/source policy (deny.toml).
#   check         — the devbox gate: build, test, clippy -D warnings, fmt --check.
#
# The Rust linter (clippy) and style checker (rustfmt) are the Lint/Format
# steps of `check`; the pinned 1.97.1 toolchain is the contract (see
# docs/agents/build-and-test.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download actionlint
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash |
          bash -s -- 1.7.7

      - name: Lint workflow
        run: ./actionlint -color

  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses, advisories, sources
        run: cargo deny check

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor
      # (kernel.apparmor_restrict_unprivileged_userns=1), which strips
      # bubblewrap's netns of CAP_NET_ADMIN — every sandboxed e2e test
      # dies with "bwrap: loopback: Failed RTM_NEWADDR: Operation not
      # permitted". Runners have passwordless sudo; lift the restriction
      # for the job.
      - name: Allow unprivileged userns (bubblewrap sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          project-path: .

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      # The devbox script forms ARE the gate (docs/agents/build-and-test.md):
      # `test` carries SHUTTLE_SYSTEMD=off; calling cargo directly skips it
      # and the systemd-touching tests fail on a runner with no systemd
      # tooling.
      - name: Build
        run: devbox run -- build

      # The image command-seam tests drive a real A/B+update_source disk
      # build, which fails closed without an existing image-signing key
      # (a build never mints one). Mint it for the runner user, guarded so
      # an existing key is never touched.
      - name: Mint the image-signing key
        run: test -f ~/.config/shuttle/secret-key || devbox run -- ./target/debug/shuttle key keygen

      - name: Test
        run: devbox run -- test

      - name: Lint (clippy)
        run: devbox run -- clippy

      - name: Format check
        run: devbox run -- fmt-check
